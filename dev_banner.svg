<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141b26"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- editor panel -->
  <rect x="50" y="30" width="710" height="336" rx="12" fill="#161b22" stroke="#2d333b" stroke-width="2"/>
  <circle cx="80" cy="60" r="7" fill="#ff5f56"/>
  <circle cx="102" cy="60" r="7" fill="#ffbd2e"/>
  <circle cx="124" cy="60" r="7" fill="#27c93f"/>
  <line x1="50" y1="88" x2="760" y2="88" stroke="#2d333b" stroke-width="2"/>
  <text x="74" y="80" fill="#8b98a5" font-size="16">davi.py</text>

  <g font-size="20">
    <!-- line 1 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.07;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="145" fill="#ff7b72">class </text>
      <text x="140" y="145" fill="#d2a8ff">Developer:</text>
    </g>
    <!-- line 2 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.13;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="172" fill="#ff7b72">    def </text>
      <text x="185" y="172" fill="#d2a8ff">__init__</text>
      <text x="300" y="172" fill="#c9d1d9">(self):</text>
    </g>
    <!-- line 3 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.19;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="199" fill="#c9d1d9">        self.name = </text>
      <text x="330" y="199" fill="#a5d6ba">"Davi Cordeiro"</text>
    </g>
    <!-- line 4 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.25;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="226" fill="#c9d1d9">        self.stack = [</text>
      <text x="330" y="226" fill="#a5d6ba">"Python"</text>
      <text x="425" y="226" fill="#c9d1d9">, </text>
      <text x="440" y="226" fill="#a5d6ba">"Django"</text>
      <text x="530" y="226" fill="#c9d1d9">,</text>
    </g>
    <!-- line 5 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.31;1" dur="8s" repeatCount="indefinite"/>
      <text x="180" y="253" fill="#a5d6ba">"React"</text>
      <text x="265" y="253" fill="#c9d1d9">, </text>
      <text x="280" y="253" fill="#a5d6ba">"Tailwind"</text>
      <text x="400" y="253" fill="#c9d1d9">]</text>
    </g>
    <!-- line 6 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.37;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="280" fill="#c9d1d9">        self.goal = </text>
      <text x="315" y="280" fill="#a5d6ba">"full-stack dev"</text>
    </g>
    <!-- line 7 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="316" fill="#c9d1d9">davi = </text>
      <text x="160" y="316" fill="#d2a8ff">Developer</text>
      <text x="285" y="316" fill="#c9d1d9">()</text>
    </g>
    <!-- line 8 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="8s" repeatCount="indefinite"/>
      <text x="74" y="343" fill="#c9d1d9">davi.</text>
      <text x="130" y="343" fill="#79c0ff">keep_learning</text>
      <text x="320" y="343" fill="#c9d1d9">()</text>
      <text x="345" y="343" fill="#6e7681">  # sempre em progresso</text>
    </g>
  </g>

  <!-- blinking cursor that moves down as lines appear, simplified: stays at end -->
  <rect x="74" y="330" width="10" height="20" fill="#c9d1d9">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1" keyTimes="0;0.52;0.6;0.7;0.8;0.9;0.95;0.98;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- right side -->
  <text x="832" y="140" fill="#ffffff" font-size="50" font-weight="700" font-family="Arial, sans-serif">Davi Cordeiro dos Santos</text>

  <g font-size="20" fill="#58a6ff">
    <text x="832" y="180">&gt; desenvolvedor full-stack em formação</text>
    <rect x="1362" y="164" width="10" height="20" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="832" y1="205" x2="1502" y2="205" stroke="#2d333b" stroke-width="2">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- badges fading in quickly, centered in the right column -->
  <g font-size="16" font-family="Menlo, Consolas, monospace">
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.575;1" dur="8s" repeatCount="indefinite"/>
      <rect x="882" y="225" width="82" height="32" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="903" y="246" fill="#58a6ff">Python</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.585;0.60;1" dur="8s" repeatCount="indefinite"/>
      <rect x="976" y="225" width="82" height="32" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="997" y="246" fill="#58a6ff">Django</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.61;0.625;1" dur="8s" repeatCount="indefinite"/>
      <rect x="1070" y="225" width="118" height="32" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="1091" y="246" fill="#58a6ff">JavaScript</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.635;0.65;1" dur="8s" repeatCount="indefinite"/>
      <rect x="1200" y="225" width="72" height="32" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="1221" y="246" fill="#58a6ff">React</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.675;1" dur="8s" repeatCount="indefinite"/>
      <rect x="1284" y="225" width="98" height="32" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="1305" y="246" fill="#58a6ff">Tailwind</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.685;0.70;1" dur="8s" repeatCount="indefinite"/>
      <rect x="1394" y="225" width="106" height="32" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="1415" y="246" fill="#58a6ff">Bootstrap</text>
    </g>
  </g>

  <!-- contact -->
  <g font-size="20" fill="#c9d1d9">
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.86;1" dur="8s" repeatCount="indefinite"/>
      <text x="832" y="310">email: davicordeiro01012008@gmail.com</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.91;1" dur="8s" repeatCount="indefinite"/>
      <text x="832" y="340">tel:   11 95177-2722</text>
    </g>
  </g>
</svg>
