<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" rx="14" fill="url(#bg)"/>

  <!-- Top status bar -->
  <rect x="16" y="14" width="868" height="60" rx="10" fill="#0f1723" stroke="#1c2836" stroke-width="1"/>
  <circle cx="34" cy="34" r="4" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="38" fill="#22d3ee" font-size="13" letter-spacing="1">ENGINEERING CONSOLE // LIVE</text>
  <text x="34" y="60" fill="#ffffff" font-size="19" font-weight="700" font-family="Arial, sans-serif">Production mindset. Playful execution.</text>

  <text x="720" y="32" fill="#6b7a8d" font-size="11" letter-spacing="1">FRAME HEALTH</text>
  <text x="720" y="55" fill="#34d399" font-size="18" font-weight="700" font-family="Arial, sans-serif">60 FPS</text>
  <g>
    <rect x="800" y="42" width="5" height="14" fill="#34d399">
      <animate attributeName="height" values="6;16;6" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;40;50" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="809" y="38" width="5" height="18" fill="#34d399">
      <animate attributeName="height" values="18;8;18" dur="1s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="38;48;38" dur="1s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="818" y="34" width="5" height="22" fill="#34d399">
      <animate attributeName="height" values="10;22;10" dur="1s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="46;34;46" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Left terminal panel -->
  <rect x="16" y="90" width="430" height="234" rx="10" fill="#0f1723" stroke="#1c2836" stroke-width="1"/>
  <circle cx="34" cy="108" r="5" fill="#ff5f56"/>
  <circle cx="50" cy="108" r="5" fill="#ffbd2e"/>
  <circle cx="66" cy="108" r="5" fill="#27c93f"/>
  <text x="86" y="112" fill="#6b7a8d" font-size="12">quality.pipeline</text>
  <line x1="16" y1="122" x2="446" y2="122" stroke="#1c2836" stroke-width="1"/>

  <text x="34" y="150" fill="#22d3ee" font-size="14">$ npm run experience</text>
  <rect x="196" y="140" width="8" height="14" fill="#e5e7eb">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- checklist lines, fade in on loop -->
  <g font-size="13">
    <g>
      <text x="34" y="182" fill="#8896a6">01</text>
      <text x="60" y="182" fill="#c7d1db">layout ........ responsive</text>
      <text x="240" y="182" fill="#34d399" font-weight="700">PASS</text>
      <animateTransform attributeName="transform" type="translate" values="0,0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.08;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="34" y="210" fill="#8896a6">02</text>
      <text x="60" y="210" fill="#c7d1db">state ......... predictable</text>
      <text x="240" y="210" fill="#3b82f6" font-weight="700">PASS</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.20;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="34" y="238" fill="#8896a6">03</text>
      <text x="60" y="238" fill="#c7d1db">motion ........ intentional</text>
      <text x="240" y="238" fill="#8b5cf6" font-weight="700">PASS</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.32;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="34" y="266" fill="#8896a6">04</text>
      <text x="60" y="266" fill="#c7d1db">details ....... obsessive</text>
      <text x="240" y="266" fill="#f59e0b" font-weight="700">PASS</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- progress bar -->
  <rect x="34" y="288" width="392" height="6" rx="3" fill="#16202c"/>
  <rect x="34" y="288" width="0" height="6" rx="3" fill="#22d3ee">
    <animate attributeName="width" values="0;0;392;392;0" keyTimes="0;0.04;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="312" fill="#4b5a6b" font-size="11">
    REBUILDING MAGIC...
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- right cards -->
  <g font-family="Arial, sans-serif">
    <!-- UI Systems -->
    <rect x="464" y="90" width="205" height="100" rx="10" fill="#0e2230" stroke="#164056" stroke-width="1"/>
    <circle cx="486" cy="112" r="10" fill="#1c3a4d"/>
    <path d="M481,112 l4,4 l8,-9" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="504" y="117" fill="#ffffff" font-size="14" font-weight="700">UI Systems</text>
    <text x="486" y="140" fill="#8fa3b0" font-size="11">Reusable, scalable</text>
    <text x="486" y="154" fill="#8fa3b0" font-size="11">components</text>
    <text x="486" y="174" fill="#22d3ee" font-size="11">SYNCED 100%</text>

    <!-- Performance -->
    <rect x="681" y="90" width="203" height="100" rx="10" fill="#0e2a1e" stroke="#1a4a34" stroke-width="1"/>
    <rect x="703" y="106" width="4" height="10" fill="#34d399"/>
    <rect x="710" y="102" width="4" height="14" fill="#34d399"/>
    <rect x="717" y="98" width="4" height="18" fill="#34d399"/>
    <text x="730" y="117" fill="#ffffff" font-size="14" font-weight="700">Performance</text>
    <text x="703" y="140" fill="#8fa3b0" font-size="11">Fast rendering, smooth</text>
    <text x="703" y="154" fill="#8fa3b0" font-size="11">frames</text>
    <text x="703" y="174" fill="#34d399" font-size="11">OPTIMIZED 98%</text>
    <circle cx="855" cy="150" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- User Flow -->
    <rect x="464" y="200" width="205" height="100" rx="10" fill="#1c1633" stroke="#332a5c" stroke-width="1"/>
    <circle cx="486" cy="222" r="10" fill="#2a2050"/>
    <line x1="481" y1="222" x2="491" y2="222" stroke="#a78bfa" stroke-width="2"/>
    <line x1="486" y1="217" x2="486" y2="227" stroke="#a78bfa" stroke-width="2"/>
    <text x="504" y="227" fill="#ffffff" font-size="14" font-weight="700">User Flow</text>
    <text x="486" y="250" fill="#a9a3c4" font-size="11">Clear states, zero dead</text>
    <text x="486" y="264" fill="#a9a3c4" font-size="11">ends</text>
    <text x="486" y="284" fill="#a78bfa" font-size="11">CONNECTED 12/12</text>

    <!-- Code Quality -->
    <rect x="681" y="200" width="203" height="100" rx="10" fill="#2a1f0e" stroke="#4d3a1a" stroke-width="1"/>
    <rect x="703" y="214" width="12" height="3" fill="#f59e0b"/>
    <rect x="703" y="220" width="12" height="3" fill="#f59e0b"/>
    <rect x="703" y="226" width="8" height="3" fill="#f59e0b"/>
    <text x="730" y="227" fill="#ffffff" font-size="14" font-weight="700">Code Quality</text>
    <text x="703" y="250" fill="#c2b28f" font-size="11">Readable, tested,</text>
    <text x="703" y="264" fill="#c2b28f" font-size="11">maintainable</text>
    <text x="703" y="284" fill="#f59e0b" font-size="11">CLEAN BUILD</text>
  </g>

  <!-- connecting dashed lines with a traveling pulse, purely decorative -->
  <line x1="669" y1="140" x2="681" y2="140" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="669" y1="250" x2="681" y2="250" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2,3"/>
</svg>
